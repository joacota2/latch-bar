[package]
name = "latch-bar"
license = "Apache-2.0"
version = "0.3.5"
description = "Your agents, right where you need them"
authors = ["Latch Bar"]
edition = "2021"

[lib]
name = "latch_bar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
arboard = "3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
core-foundation = "0.10"
core-graphics = { version = "0.25", features = ["elcapitan"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSEvent", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSWindow", "NSWorkspace", "block2"] }
